[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytopmod"
version = "0.1.0"
requires-python = ">=3.12"

authors = [
  {name = "Davy Risso", email = "davy.risso@gmail.com"},
]
readme = "README.md"

[tool.ruff]
line-length = 80
indent-width = 2

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.1",
]
